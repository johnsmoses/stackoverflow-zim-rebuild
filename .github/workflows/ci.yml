# CI pipeline for stackoverflow-zim-rebuild (Task 10).
#
# Safety contract:
#   - CI never downloads the StackExchange dump or the IA image corpus.
#   - No WireGuard, no tunnel, no privileged network anywhere in this file.
#   - Every job is offline-except-pip/git-clone and stays well under the
#     ~20 min GitHub runner budget.
#   - Minimal token scope (H2): the whole workflow runs with
#     contents: read; contents: write is granted ONLY in the release
#     workflow's release job (.github/workflows/release.yml).
#
# Third-party Actions are pinned to immutable commit SHAs (H3). Each pin is
# the current tip of the tag noted in the comment; bump deliberately.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Shell syntax + shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          bash -n bin/* scripts/*.sh
          shellcheck bin/* scripts/*.sh
      - name: Compile all Python
        run: |
          python -m py_compile scripts/*.py recovery/*.py recovery/lib/*.py tests/recovery/*.py tests/ci/*.py
      - name: pyflakes (light lint; no flake8/ruff config in pyproject)
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes scripts recovery tests

  # The critical job: prove the pinned upstream base commit + the 9-patch
  # series still assemble into exactly the tree recorded in sotoki.lock,
  # then run the incremental-render regression gate (H8) against that
  # patched source. A drift or a semantic regression fails CI.
  patch-apply-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install gate dependencies
        run: |
          # Dependencies here are needed only to import the patched
          # sotoki.posts for the tree-hash and incremental-render gates.
          python -m pip install --quiet pyyaml pytest \
            zimscraperlib kiwixstorage beautifulsoup4 mistune \
            python-slugify tld jinja2 jinja2-pluralize requests \
            backoff psutil
      - name: Clone upstream sotoki at pinned base commit
        run: |
          # Full clone (fetches all heads incl. the branch containing the
          # base commit), then detach at the pinned SHA. GitHub does not
          # allow fetching a bare SHA, so there is no separate fetch step.
          git clone --quiet https://github.com/openzim/sotoki /tmp/sotoki
          git -C /tmp/sotoki checkout --quiet 157ca9a1c73e3e6349f1c80bb03e058355aef743
          test "$(git -C /tmp/sotoki rev-parse HEAD)" = "157ca9a1c73e3e6349f1c80bb03e058355aef743"
      - name: Apply patch series in order (0001-0009)
        run: |
          cd /tmp/sotoki
          git config user.name "CI patch-apply gate"
          git config user.email "ci@stackoverflow-zim-rebuild.invalid"
          # Lexical order of patches/sotoki/*.patch == series order.
          # --3way is allowed, but the am MUST succeed: any drift fails CI.
          git am --3way "$GITHUB_WORKSPACE"/patches/sotoki/*.patch
      - name: Compare assembled tree hash against sotoki.lock
        run: |
          actual="$(git -C /tmp/sotoki rev-parse 'HEAD^{tree}')"
          expected="$(python3 -c "import yaml; print(yaml.safe_load(open('sotoki.lock'))['patch_series']['tree_hash'])")"
          echo "actual=${actual}"
          echo "expected=${expected}"
          test "${actual}" = "${expected}" || {
            echo "::error::tree hash mismatch: patches do not assemble to the locked tree"
            exit 1
          }
      - name: Incremental-render regression gate (H8)
        run: |
          SOTOKI_PATCHED_SRC=/tmp/sotoki/src \
            python3 -m pytest tests/ci/incremental_regression_test.py -q
      - name: Grep diagnostics (informational only, never fatal)
        run: |
          cd /tmp/sotoki
          if grep -q "source_sha256" src/sotoki/posts.py; then
            echo "OK: source_sha256 marker present in src/sotoki/posts.py"
          else
            echo "WARN: source_sha256 marker missing from src/sotoki/posts.py"
          fi
          if grep -q "should_skip_render" src/sotoki/posts.py; then
            echo "OK: should_skip_render marker present in src/sotoki/posts.py"
          else
            echo "WARN: should_skip_render marker missing from src/sotoki/posts.py"
          fi

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run recovery test suite
        # Offline by construction: tests/recovery/conftest.py blocks sockets.
        run: python -m pytest tests/recovery -q

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse every data/config JSON
        run: |
          python3 - <<'PY'
          import glob, json
          files = sorted(glob.glob("data/*.json") + glob.glob("configs/*.json"))
          for f in files:
              json.load(open(f, encoding="utf-8"))
          print(f"OK: {len(files)} JSON files parsed")
          PY
      - name: Validate valkey.conf.template substitution sanity
        run: |
          python3 - <<'PY'
          import pathlib
          tpl = pathlib.Path("configs/valkey.conf.template").read_text()
          rendered = tpl.replace("@PORT@", "16379").replace("@REDIS_DIR@", "/tmp/valkey-ci")
          assert "port 16379" in rendered and "dir /tmp/valkey-ci" in rendered
          assert "dbfilename sotoki.rdb" in rendered
          assert "@" not in rendered, \
              "unsubstituted placeholder left in rendered config"
          print("OK: template substitution sanity")
          PY

  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify every markdown link target exists
        run: |
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path(".")
          targets = [root / "README.md", *sorted(root.glob("docs/*.md"))]
          missing = []
          for md in targets:
              for m in re.finditer(r"\[[^\]]*\]\(([^)#\s]+\.md)(?:#[^)]*)?\)", md.read_text()):
                  rel = m.group(1)
                  if rel.startswith("http"):
                      continue
                  p = (md.parent / rel).resolve()
                  if not p.exists():
                      missing.append(f"{md}: {m.group(0)}")
          assert not missing, f"broken markdown links:\n" + "\n".join(missing)
          print(f"OK: links in {len(targets)} markdown files resolve")
          PY

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build worker image
        run: docker build -t image-worker:ci docker/image-worker
      - name: "Import smoke test (H1: --network none)"
        run: |
          # ENTRYPOINT is python3, so the -c script is passed directly
          # (a bare `python3` here would exec python3 python3 ...).
          docker run --network none --rm image-worker:ci \
            -c "import recover_convert_images; import ia_sstatic_basename_recovery; print('import smoke OK')"