# sotoki.lock — pins the upstream sotoki source and the state of the
# patches/sotoki/ series. This is the contract for reproducibility:
# the ZIM must be rebuildable from base_commit + the patch series.

upstream:
  url: https://github.com/openzim/sotoki
  base_commit: 157ca9a

patch_series:
  status: captured   # capture-pending | captured | applied
  directory: patches/sotoki/
  commit_count: 9
  implemented_features:
    - snapshot-aware incremental mode
  note: >
    9-patch series: 5 patches captured from the working site-packages
    install, parameterized to remove machine-specific paths (see
    patches/sotoki/README.md), plus 4 new commits (0006-0009) implementing
    the snapshot-aware incremental update mode (fingerprint + render
    contract, per-snapshot build dirs, seen sets, opt-in hardened prune,
    local archive support, Redis ownership). Each patch must apply cleanly
    on base_commit; a patch failure on a newer upstream must be explicit.

requirements:
  python: ">=3.12"

notes:
  - "Do not bump base_commit without re-validating the full patch series."
  - "See docs/patch-maintenance.md for capture/order/apply policy."